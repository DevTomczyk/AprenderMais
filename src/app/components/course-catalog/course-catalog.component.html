<section id="catalogo" aria-labelledby="catalog-title"><div class="heading"><div><p class="eyebrow">CATÁLOGO</p><h2 id="catalog-title">Encontre sua próxima habilidade</h2></div><span>{{ courses.length }} cursos disponíveis</span></div><div class="grid">@for (course of courses; track course.id) { <app-course-card [course]="course" (selected)="courseSelected.emit($event)" (favoriteChanged)="favoriteChanged.emit($event)" (addToCart)="addToCart.emit($event)"></app-course-card> } @empty { <p>Nenhum curso cadastrado no momento.</p> }</div></section>
